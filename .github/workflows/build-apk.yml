name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for GitHub Release (e.g. v1.0.0 or latest)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Release ASTRA AI Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure environment configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Copying .env.example to .env for build compatibility..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            echo "Creating empty .env for Secrets Gradle Plugin..."
            touch .env
          fi

      - name: Restore or generate debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding repository debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "./debug.keystore" ]; then
            echo "Generating new temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -s "./debug.keystore" ]; then
            echo "::error::debug.keystore file is missing or empty."
            exit 1
          fi

      - name: Build debug APK using Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            echo "Found ./gradlew wrapper script. Setting execute permissions..."
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            echo "Gradle wrapper script not found. Using system Gradle..."
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate, verify and stage APK
        id: stage_apk
        run: |
          echo "Scanning for generated APK files..."
          FOUND_APK=""
          if [ -d "app/build/outputs/apk/debug" ]; then
            FOUND_APK=$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$FOUND_APK" ] && [ -d "app/build/outputs/apk" ]; then
            FOUND_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No debug APK found in app/build/outputs/apk!"
            echo "Directory listing of app/build/outputs (if available):"
            ls -laR app/build/outputs || true
            exit 1
          fi

          FILE_BYTES=$(wc -c < "$FOUND_APK" | tr -d ' ')
          if [ "$FILE_BYTES" -le 1024 ]; then
            echo "::error::Generated APK ($FOUND_APK) is invalid or empty (size: $FILE_BYTES bytes)."
            exit 1
          fi

          FILE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_BYTES / 1048576}")
          echo "Successfully verified APK: $FOUND_APK"
          echo "Size: $FILE_BYTES bytes (~$FILE_MB MB)"

          STAGING_DIR="${RUNNER_TEMP}/astra_release_staging"
          mkdir -p "$STAGING_DIR"
          STAGED_APK="${STAGING_DIR}/ASTRA-AI-debug.apk"

          cp "$FOUND_APK" "$STAGED_APK"

          SHA256_HASH=$(sha256sum "$STAGED_APK" | awk '{print $1}')
          echo "SHA-256: $SHA256_HASH"

          echo "apk_path=$STAGED_APK" >> "$GITHUB_OUTPUT"
          echo "apk_filename=ASTRA-AI-debug.apk" >> "$GITHUB_OUTPUT"
          echo "apk_size_mb=$FILE_MB" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-AI-debug-apk
          path: ${{ steps.stage_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Determine GitHub Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v1.0.0"
          fi

          echo "Selected release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release_info.outputs.tag }}"
          ASSET_PATH="${{ steps.stage_apk.outputs.apk_path }}"
          ASSET_NAME="${{ steps.stage_apk.outputs.apk_filename }}"
          APK_SIZE="${{ steps.stage_apk.outputs.apk_size_mb }}"
          APK_SHA="${{ steps.stage_apk.outputs.apk_sha256 }}"

          echo "Checking GitHub CLI status..."
          gh --version

          RELEASE_TITLE="ASTRA AI — Debug Build ($RELEASE_TAG)"
          RELEASE_NOTES="### ASTRA AI — Android Tablet Application (Lenovo TB350FU)
          **Package ID:** \`com.aistudio.astraai.qvwxzk\`
          **Version:** \`1.0\`
          **File:** \`$ASSET_NAME\` (~$APK_SIZE MB)
          **SHA-256:** \`$APK_SHA\`

          #### Included Features:
          - Full ASTRA AI Assistant with animated Arc Reactor
          - Gemini AI reasoning & speech interaction
          - Integrated ASTRA NEXUS Admin Console (Shield icon, private PIN: \`4000\`)
          - Hardware telemetry (battery, storage, network diagnostics)

          #### Tablet Installation:
          1. Download \`$ASSET_NAME\` directly from the **Assets** section below.
          2. On your Android tablet, tap the downloaded file and select **Install**.
          3. If prompted, allow 'Install unknown apps' for your browser/file manager."

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release '$RELEASE_TAG' already exists. Uploading/updating asset with --clobber..."
            if ! gh release upload "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" --clobber; then
              echo "::error::Failed to upload APK asset to existing release $RELEASE_TAG."
              echo "Note: If you encounter HTTP 403, enable 'Read and write permissions' in GitHub Repository: Settings -> Actions -> General -> Workflow permissions."
              exit 1
            fi
          else
            echo "Creating new GitHub Release '$RELEASE_TAG'..."
            if ! gh release create "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest; then
              echo "::error::Failed to create GitHub Release $RELEASE_TAG."
              echo "Note: If you encounter HTTP 403, enable 'Read and write permissions' in GitHub Repository: Settings -> Actions -> General -> Workflow permissions."
              exit 1
            fi
          fi

          echo "Release successfully updated with APK asset!"
          RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG")
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Generate Workflow Summary
        if: always()
        run: |
          APK_NAME="${{ steps.stage_apk.outputs.apk_filename }}"
          APK_SIZE="${{ steps.stage_apk.outputs.apk_size_mb }}"
          RELEASE_TAG="${{ steps.release_info.outputs.tag }}"
          RELEASE_URL="${{ steps.publish_release.outputs.release_url }}"

          echo "## ⚡ ASTRA AI Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Filename:** \`$APK_NAME\` (~$APK_SIZE MB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact Backup:** Downloadable as **\`ASTRA-AI-debug-apk\`** in the Actions Artifacts section." >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$RELEASE_URL" ]; then
            echo "- **GitHub Release Page:** [$RELEASE_TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Download:** Download \`$APK_NAME\` under the Assets section of that release." >> "$GITHUB_STEP_SUMMARY"
          fi
